/* ---------- QR code (correção M, modo bytes, versões 1–10) ---------- */
const QR=(()=>{
const ECC=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,2,2,4,4,4,5,5,5];
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
const dataCw=v=>Math.floor(raw(v)/8)-ECC[v-1]*NB[v-1];
const bit=(x,i)=>((x>>>i)&1)!==0;
const COND=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
function make(text){
const bytes=[...new TextEncoder().encode(text)];let ver=0;
for(let v=1;v<=10;v++)if(4+(v<10?8:16)+bytes.length*8<=dataCw(v)*8){ver=v;break}
if(!ver)throw new Error('Link longo demais para o QR code.');
const bits=[],put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
put(0,Math.min(4,dataCw(ver)*8-bits.length));while(bits.length%8)bits.push(0);
const data=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=(x<<1)|bits[i+j];data.push(x)}
for(let pad=0xEC;data.length<dataCw(ver);pad^=0xEC^0x11)data.push(pad);
const nb=NB[ver-1],el=ECC[ver-1],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),div=rsDiv(el),blocks=[];
for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(e))}
const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)cw.push(b[i])});
const n=ver*4+17,M=[],Fn=[];for(let y=0;y<n;y++){M.push(new Array(n).fill(false));Fn.push(new Array(n).fill(false))}
const set=(x,y,v)=>{M[y][x]=v;Fn[y][x]=true};
for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n)set(x,y,d!==2&&d!==4)}};
finder(3,3);finder(n-4,3);finder(3,n-4);
const al=ver===1?[]:(()=>{const c=Math.floor(ver/7)+2,st=ver===32?26:Math.ceil((ver*4+4)/(c*2-2))*2,r=[6];for(let p=n-7;r.length<c;p-=st)r.splice(1,0,p);return r})();
for(let i=0;i<al.length;i++)for(let j=0;j<al.length;j++){if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))continue;
for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
const drawFmt=mk=>{const d=mk;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const bs=((d<<10)|r)^0x5412;
for(let i=0;i<=5;i++)set(8,i,bit(bs,i));set(8,7,bit(bs,6));set(8,8,bit(bs,7));set(7,8,bit(bs,8));for(let i=9;i<15;i++)set(14-i,8,bit(bs,i));
for(let i=0;i<8;i++)set(n-1-i,8,bit(bs,i));for(let i=8;i<15;i++)set(8,n-15+i,bit(bs,i));set(8,n-8,true)};
drawFmt(0);
if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const bs=(ver<<12)|r;for(let i=0;i<18;i++){const c=bit(bs,i),a=n-11+i%3,b=Math.floor(i/3);set(a,b,c);set(b,a,c)}}
let k=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<n;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-v:v;if(!Fn[y][x]&&k<cw.length*8){M[y][x]=bit(cw[k>>>3],7-(k&7));k++}}}
const apply=mk=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!Fn[y][x]&&COND[mk](x,y))M[y][x]=!M[y][x]};
const penalty=()=>{let p=0,dark=0;const L=[];for(let y=0;y<n;y++){let s='';for(let x=0;x<n;x++){const v=M[y][x];s+=v?'1':'0';if(v)dark++}L.push(s)}
for(let x=0;x<n;x++){let s='';for(let y=0;y<n;y++)s+=M[y][x]?'1':'0';L.push(s)}
for(const s of L){(s.match(/0{5,}|1{5,}/g)||[]).forEach(q=>{p+=q.length-2});for(let i=0;i+11<=n;i++){const w=s.substr(i,11);if(w==='10111010000'||w==='00001011101')p+=40}}
for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const v=M[y][x];if(v===M[y][x+1]&&v===M[y+1][x]&&v===M[y+1][x+1])p+=3}
return p+(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10};
let best=0,bp=1e9;for(let mk=0;mk<8;mk++){apply(mk);drawFmt(mk);const p=penalty();if(p<bp){bp=p;best=mk}apply(mk)}
apply(best);drawFmt(best);
return{n,ver,get:(x,y)=>M[y][x]}}
return{make}})();

const PAL={azul:{n:'Azul profissional',a:'#1e1b4b',b:'#4338ca',fg:'#ffffff',mu:'#c7d2fe',ac:'#fbbf24',pt:'#1f1300'},
laranja:{n:'Laranja energia',a:'#7c2d12',b:'#c2410c',fg:'#ffffff',mu:'#ffedd5',ac:'#fde047',pt:'#2a1a00'},
verde:{n:'Verde',a:'#052e16',b:'#15803d',fg:'#ffffff',mu:'#dcfce7',ac:'#fde047',pt:'#2a1f00'},

claro:{n:'Claro',a:'#f8fafc',b:'#e0e7ff',fg:'#111827',mu:'#475569',ac:'#4f46e5',pt:'#ffffff'}};
const SERIF='"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif',SANS='-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',MONO='ui-monospace,Menlo,Consolas,monospace';
let FL=null,flRaf=0;
const flCode=j=>j.id.replace(/-/g,'').slice(0,10),flUrl=j=>location.origin+'/v/'+flCode(j);
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapT(c,t,w){const out=[];let cur='';for(let word of String(t).split(/\s+/).filter(Boolean)){
while(c.measureText(word).width>w){let i=word.length-1;while(i>1&&c.measureText(word.slice(0,i)).width>w)i--;if(cur){out.push(cur);cur=''}out.push(word.slice(0,i));word=word.slice(i)}
const x=cur?cur+' '+word:word;if(!cur||c.measureText(x).width<=w)cur=x;else{out.push(cur);cur=word}}if(cur)out.push(cur);return out}
function fitT(c,t,font,sizes,w,max){let lines=[],s=sizes[sizes.length-1];for(const z of sizes){c.font=font(z);lines=wrapT(c,t,w);s=z;if(lines.length<=max)return{s,lines}}
lines=lines.slice(0,max);if(lines.length){let l=lines[lines.length-1];while(l.length>1&&c.measureText(l+'…').width>w)l=l.slice(0,-1);lines[lines.length-1]=l+'…'}return{s,lines}}
function drawQR(c,q,x,y,px){const m=Math.max(2,Math.floor(px/(q.n+8))),w=m*(q.n+8);c.fillStyle='#ffffff';rrect(c,x,y,w,w,m*3);c.fill();c.fillStyle='#000000';
for(let j=0;j<q.n;j++)for(let i=0;i<q.n;i++)if(q.get(i,j))c.fillRect(x+m*(i+4),y+m*(j+4),m,m);return w}
function drawFlyer(cv,d,job,fmt,qr,url,company){
const story=fmt==='story',W=1080,H=story?1920:1080,P=story?84:68,pal=PAL[d.mood]||PAL.azul,c=cv.getContext('2d');cv.width=W;cv.height=H;
const g=c.createLinearGradient(0,0,W*.6,H);g.addColorStop(0,pal.a);g.addColorStop(1,pal.b);c.fillStyle=g;c.fillRect(0,0,W,H);
c.globalAlpha=.12;c.fillStyle=pal.ac;c.beginPath();c.arc(W-70,story?230:120,story?330:250,0,7);c.fill();
c.globalAlpha=.07;c.fillStyle=pal.fg;c.beginPath();c.arc(40,H-(story?560:400),story?380:300,0,7);c.fill();c.globalAlpha=1;
const CW=W-2*P;c.textBaseline='alphabetic';c.textAlign='left';
// QR (ancorado embaixo)
const qpx=story?430:262,qw=Math.floor(qpx/(qr.n+8))*(qr.n+8),qy=H-P-qw,yMax=qy-(story?60:34);
drawQR(c,qr,P,qy,qpx);
const tx=P+qw+(story?44:34),tw=W-P-tx;
c.fillStyle=pal.fg;let f=fitT(c,d.cta||'Escaneie e candidate-se',z=>`800 ${z}px ${SANS}`,story?[50,44,38,34]:[40,36,32,28],tw,3);
let ty=qy+(story?64:48);c.font=`800 ${f.s}px ${SANS}`;f.lines.forEach(l=>{c.fillText(l,tx,ty);ty+=f.s*1.18});
c.fillStyle=pal.mu;const short=url.replace(/^https?:\/\//,'');let us=story?30:25;for(const z of story?[30,26,23,20]:[25,22,20]){us=z;c.font=`600 ${z}px ${MONO}`;if(c.measureText(short).width<=tw)break}c.font=`600 ${us}px ${MONO}`;wrapT(c,short,tw).slice(0,3).forEach(l=>{ty+=us*.4;c.fillText(l,tx,ty+us*.6);ty+=us*1.05});
c.font=`600 ${story?24:20}px ${SANS}`;c.globalAlpha=.8;c.fillText('Candidatura online · Talentos',tx,qy+qw-6);c.globalAlpha=1;
// topo: selo + empresa
let y=P;c.font=`800 ${story?30:26}px ${SANS}`;const bt='ESTAMOS CONTRATANDO',pad=story?26:22,ph=story?58:50;if('letterSpacing' in c)c.letterSpacing='2px';
const pw=c.measureText(bt).width+pad*2;c.fillStyle=pal.ac;rrect(c,P,y,pw,ph,ph/2);c.fill();c.fillStyle=pal.pt;c.fillText(bt,P+pad,y+ph/2+(story?10:9));if('letterSpacing' in c)c.letterSpacing='0px';
y+=ph+(story?44:34);c.fillStyle=pal.mu;c.font=`700 ${story?40:32}px ${SANS}`;const cn=fitT(c,company,z=>`700 ${z}px ${SANS}`,[story?40:32,28],CW,1);c.font=`700 ${cn.s}px ${SANS}`;c.fillText(cn.lines[0]||'',P,y+cn.s*.8);y+=cn.s+(story?44:30);
// título
c.fillStyle=pal.fg;const hs=story?[112,100,90,80,70,62]:[84,76,68,60,54,48],hl=fitT(c,d.headline||job.title,z=>`700 ${z}px ${SERIF}`,hs,CW,story?5:3);c.font=`700 ${hl.s}px ${SERIF}`;
hl.lines.forEach(l=>{y+=hl.s*1.05;c.fillText(l,P,y);y+=hl.s*.1});y+=story?34:22;
// subtítulo
if(d.tagline){const ts=story?40:31,tl=fitT(c,d.tagline,z=>`400 ${z}px ${SANS}`,[ts,ts-4],CW,story?3:2);c.fillStyle=pal.mu;c.font=`400 ${tl.s}px ${SANS}`;tl.lines.forEach(l=>{y+=tl.s*1.35;c.fillText(l,P,y)});y+=story?30:20}
// etiquetas
const tg=[place(job)!=='—'?place(job):'',job.mode,job.area].filter(Boolean);c.font=`700 ${story?30:26}px ${SANS}`;let cx=P;const ch=story?58:48;y+=story?10:4;
for(const t of tg){const w=c.measureText(t).width+(story?44:36);if(cx+w>W-P&&cx>P){cx=P;y+=ch+12}c.fillStyle='rgba(255,255,255,.16)';if(d.mood==='claro')c.fillStyle='rgba(79,70,229,.14)';rrect(c,cx,y,w,ch,ch/2);c.fill();c.fillStyle=pal.fg;c.fillText(t,cx+(story?22:18),y+ch/2+(story?10:9));cx+=w+12}
y+=ch+(story?48:34);
// destaques (somente o que couber)
const bs=story?38:30,bl=bs*1.3;c.font=`500 ${bs}px ${SANS}`;
for(const b of (d.bullets||[]).filter(Boolean).slice(0,4)){const ls=wrapT(c,b,CW-48).slice(0,2);if(y+ls.length*bl>yMax)break;
c.fillStyle=pal.ac;c.beginPath();c.arc(P+10,y+bl*.5-4,9,0,7);c.fill();c.fillStyle=pal.fg;ls.forEach((l,i)=>c.fillText(l,P+40,y+bs*.95+i*bl));y+=ls.length*bl+(story?20:12)}}

function flDef(j){const co=S.company.name,b=[],pl=place(j)!=='—'?place(j):'';
if(j.skills.length)b.push('Habilidades: '+j.skills.slice(0,4).join(', '));if(j.minYears>0)b.push('Experiência mínima: '+j.minYears+(j.minYears>1?' anos':' ano'));if(j.minEdu)b.push('Escolaridade mínima: '+j.minEdu);b.push('Candidatura 100% online');
return{headline:('Estamos contratando: '+j.title).slice(0,70),tagline:`${co} está com vaga aberta${pl&&j.mode!=='Remoto'?' em '+pl:''}.`,bullets:b.slice(0,4),cta:'Escaneie o QR code e candidate-se',mood:'azul'}}
function flStart(j){FL={job:j,copy:flDef(j),fmt:'feed',note:'',busy:false,qr:QR.make(flUrl(j)),ai:false}}
async function openFl(id){const j=jobs.find(x=>x.id===id);if(!j)return;flStart(j);tab='nova';J=null;render();scrollTo(0,0);flAI()}

async function flAI(){if(!FL||FL.busy)return;const f=FL;f.busy=true;f.note='Gerando o texto com IA…';flNote();
try{const d=await api('POST','/jobs/'+f.job.id+'/flyer-copy',{});if(FL!==f)return;

async function loadPdv(){try{const[s,i,h]=await Promise.all([api('GET','/erp/pdv/session'),api('GET','/erp/items'),api('GET','/erp/pdv/sessions')]);PD.ses=s.session;PD.sales=s.sales;PD.moves=s.moves;PD.items=i.items.filter(x=>x.active);PD.hist=h.sessions;

const pdQ=s=>{s=String(s??'').trim().replace(',','.');return/^\d+(\.\d{1,3})?$/.test(s)?Math.round(parseFloat(s)*1000):NaN};
const pdLine=l=>{const q=pdQ(l.q);return isNaN(q)?0:Math.round(q*l.price/1000)};
const pdSub=()=>PD.cart.reduce((a,l)=>a+pdLine(l),0),pdDisc=()=>{const d=toCents(PD.disc);return isNaN(d)?0:d},pdTot=()=>Math.max(0,pdSub()-pdDisc());

const pdStock=id=>(PD.items.find(x=>x.id===id)||{q:0}).q;
function pdBad(){for(const l of PD.cart){const q=pdQ(l.q);if(isNaN(q)||q<=0)return'Quantidade inválida em "'+l.name+'".';if(l.unit==='un'&&q%1000)return'"'+l.name+'" aceita só quantidade inteira.'}

const pdSearchRe=()=>{const e=$('#psr');if(e){e.innerHTML=pdResults();e.classList.toggle('e',!PD.q)}};

const cash=PD.pays.find(p=>p.m==='cash'),rv=cash?toCents(cash.recv):NaN,cv=cash?toCents(cash.v):0,troco=cash&&!isNaN(rv)&&rv>cv?rv-cv:0;

+(PD.cart.length?`<div class="pdr"><span class="mu">Subtotal</span><span>${BRL(sub)}</span></div><div class="pdr"><span class="mu">Desconto (R$)</span><input style="width:110px;margin:0;text-align:right" inputmode="decimal" placeholder="0,00" aria-label="Desconto" value="${esc(PD.disc)}" onchange="pdDiscSet(this.value)"></div>

<div class="pdr"><span class="mu">Pago</span><span>${BRL(paid)}</span></div>

function mvPanel(u){const T=mvTpl(),needs=T&&/\{(data|hora|local)\}/.test(T.body);
return`<div class="mvp"><b>Mover para ${mv.s}</b>
${needs?`<div class="g"><label>Data<input type="date" value="${esc(mvInfo.date)}" oninput="mvInfo.date=this.value;mvPrev()"></label><label>Horário<input type="time" value="${esc(mvInfo.time)}" oninput="mvInfo.time=this.value;mvPrev()"></label><label>Local ou link<input maxlength="200" value="${esc(mvInfo.place)}" placeholder="Endereço ou link da videochamada" oninput="mvInfo.place=this.value;mvPrev()"></label></div>`:''}
${T?`<div class="mu">Mensagem para ${esc(u.name)} por ${CHL[T.ch]}:</div><pre class="msg" id="mvpre">${esc(fillT(T.body,mvVars(u)))}</pre>`:''}
<div class="row"><div>${T?`<button class="pri" onclick="doMove(false)">Mover e enviar</button> <button onclick="doMove(true)">Mover sem enviar</button>`:`<button class="pri" onclick="doMove(false)">Confirmar</button>`}</div><button onclick="mv=null;render()">Cancelar</button></div></div>`}
function mvPrev(){const el=$('#mvpre');if(!el||!mv)return;const u=cands.find(x=>x.id===mv.cid),T=mvTpl();if(u&&T)el.textContent=fillT(T.body,mvVars(u))}
async function askMove(id,s){const a=apps.find(x=>x.id===id);if(!a||a.status===s||!can('move'))return;await ensureMsgs();mvInfo={date:'',time:'',place:''};delete lastMv[id];
mv={id,s,from:a.status,cid:a.candId,job:a.jobId};
if(mvTpl())render();else if(s==='Recusado'&&!confirm('Marcar esta candidatura como Recusado?'))mv=null;else doMove(false)}
async function doMove(silent){const m=mv;if(!m)return;const T=mvTpl();
try{const d=await api('PATCH','/apps/'+m.id,{status:m.s,silent:silent||undefined,info:{date:mvInfo.date,time:mvInfo.time,place:mvInfo.place}});
const a=apps.find(x=>x.id===m.id);a.status=d.status;(a.hist=a.hist||[]).push({t:Date.now(),by:S.name,from:m.from,to:d.status});
lastMv[m.id]={...d,wantWa:!!T&&!silent&&T.ch!=='email',silent:!!silent};mv=null;render()}catch(e){alert(e.message);mv=null;render()}}
function mvResult(u,r){const L=[];
if(r.silent)L.push('Etapa atualizada sem enviar mensagem. O candidato vê a mudança no sistema.');
else{L.push('Etapa atualizada. O candidato recebeu o aviso no sistema.');
const M={sent:'E-mail enviado para '+u.name+'.',dev:'E-mail registrado no terminal do servidor (modo de desenvolvimento).',off:'E-mail não enviado: o envio por e-mail ainda não está configurado no servidor (RESEND_API_KEY e MAIL_FROM).',fail:'Não foi possível enviar o e-mail. Tente de novo mais tarde.',dup:'E-mail não reenviado: esta mensagem já foi enviada nas últimas 24 horas.',limit:'Limite de e-mails por hora atingido. Tente mais tarde.'}[r.mail];if(M)L.push(M)}
return`<div class="res" role="status">${L.map(x=>`<div>${esc(x)}</div>`).join('')}${r.wa?`<a class="btn pri sm" href="${esc(r.wa)}" target="_blank" rel="noopener noreferrer">Enviar no WhatsApp</a><div class="mu">Abre o WhatsApp com a mensagem pronta. Você confirma o envio lá.</div>`:r.wantWa?'<div>Não foi possível montar o link do WhatsApp: o candidato não informou um telefone válido.</div>':''}</div>`}
/* ---------- mensagens automáticas ---------- */
const VARS=[['nome','Primeiro nome do candidato'],['vaga','Título da vaga'],['empresa','Nome da empresa'],['recrutador','Seu nome'],['data','Data da entrevista'],['hora','Horário'],['local','Local ou link']];
const CHO={email:'E-mail',whatsapp:'WhatsApp',both:'E-mail e WhatsApp'};
async function loadMsgs(){MGerr='';try{MG=await api('GET','/messages')}catch(e){MGerr=e.message}render()}
function msgCard(s){const m=MG.msgs[s],ed=MG.canEdit;
return`<div class="card"><div class="row"><h3 style="margin:0">${s}</h3><label class="sw"><input type="checkbox" ${m.on?'checked':''} ${ed?'':'disabled'} onchange="MG.msgs['${s}'].on=this.checked"> Enviar ao mover para esta etapa</label></div>
<div class="g"><label>Enviar por<select ${ed?'':'disabled'} onchange="MG.msgs['${s}'].ch=this.value;render()">${Object.entries(CHO).map(([k,v])=>`<option value="${k}"${m.ch===k?' selected':''}>${v}</option>`).join('')}</select></label>
${m.ch!=='whatsapp'?`<label>Assunto do e-mail<input maxlength="120" value="${esc(m.subj)}" ${ed?'':'disabled'} onchange="MG.msgs['${s}'].subj=this.value"></label>`:''}</div>
<label>Mensagem<textarea id="mb-${s}" rows="6" maxlength="1500" ${ed?'':'disabled'} onchange="MG.msgs['${s}'].body=this.value">${esc(m.body)}</textarea></label>
${ed?`<div class="chips" aria-label="Inserir variável">${VARS.map(([k,d])=>`<button class="chip" title="${d}" onclick="insVar('${s}','${k}')">{${k}}</button>`).join('')}</div>`:''}</div>`}
function insVar(s,k){const t=$('#mb-'+s);if(!t)return;const a=t.selectionStart??t.value.length,b=t.selectionEnd??a,v='{'+k+'}';t.value=t.value.slice(0,a)+v+t.value.slice(b);t.focus();t.selectionStart=t.selectionEnd=a+v.length;MG.msgs[s].body=t.value}
function vMsgs(){if(MGerr)return`<div class="card err">${esc(MGerr)}</div>`;if(!MG)return'<div class="card mu">Carregando…</div>';
return`<div class="card"><h3>Mensagens automáticas</h3><p class="mu" style="margin-top:0">Escolha o que o candidato recebe quando você move a candidatura de etapa. Dentro do sistema ele sempre vê um aviso. O e-mail sai pela plataforma e as respostas chegam ao e-mail de quem moveu. No WhatsApp, o link abre a conversa com a mensagem pronta e você confirma o envio.</p></div>${MSTG.map(msgCard).join('')}${MG.canEdit?'<button class="pri" onclick="saveMsgs()">Salvar mensagens</button>':'<p class="mu">Só administrador e RH editam os modelos.</p>'}`}
async function saveMsgs(){try{MG=await api('PUT','/messages',{msgs:MG.msgs});render();toast('Mensagens salvas')}catch(e){alert(e.message)}}
/* ---------- integrações de vagas ---------- */
const PL={greenhouse:'Greenhouse',lever:'Lever'};
async function loadInteg(){IGerr='';IGmsg='';try{IG=await api('GET','/integrations')}catch(e){IGerr=e.message}render()}
function vInteg(){if(IGerr)return`<div class="card err">${esc(IGerr)}</div>`;if(!IG)return'<div class="card mu">Carregando…</div>';
return`<div class="card"><h3>Vagas de outras plataformas</h3><p class="mu" style="margin-top:0">Conecte a página de vagas da sua empresa. As vagas aparecem para todos os candidatos em Vagas de outras plataformas (menu do perfil), com link para se candidatar no site de origem.</p>
${IG.items.map(x=>`<div class="row it"><div><b>${esc(x.label)}</b><div class="mu">${PL[x.type]} · ${esc(x.slug)}</div></div><button class="sm" onclick="delInteg('${x.id}')">Desconectar</button></div>`).join('')||'<p class="mu">Nenhuma plataforma conectada.</p>'}
<div class="g"><label>Plataforma<select id="it"><option value="greenhouse">Greenhouse</option><option value="lever">Lever</option></select></label><label>Identificador<input id="is" maxlength="60" placeholder="ex.: minhaempresa"></label><label>Nome exibido (opcional)<input id="il" maxlength="60" placeholder="${esc(S.company.name)}"></label></div>
<p class="mu">O identificador é o final do endereço da sua página de vagas: boards.greenhouse.io/<b>identificador</b> ou jobs.lever.co/<b>identificador</b>.</p>
<div class="${IGmsg?'mu':'err'}" id="ier">${esc(IGmsg)}</div><button class="pri" onclick="addInteg()">Conectar</button></div>
<div class="card"><h3>Fontes gerais</h3><p class="mu" style="margin-top:0"><b>Remotive</b>: ativa, com vagas remotas do mundo todo.<br><b>Adzuna</b>: ${IG.global.adzuna?'ativa, com vagas do Brasil.':'desativada. Para ativar, crie uma conta gratuita em developer.adzuna.com e defina ADZUNA_APP_ID e ADZUNA_APP_KEY no servidor.'}<br>LinkedIn, Indeed e Gupy não oferecem acesso aberto à lista de vagas e por isso não estão conectados.</p></div>`}
async function addInteg(){try{const d=await api('POST','/integrations',{type:$('#it').value,slug:$('#is').value.trim(),label:$('#il').value.trim()});IG.items=d.items;X.items=null;IGmsg=`Conectado. Encontramos ${d.found} vaga(s) publicada(s).`;render()}catch(e){const el=$('#ier');el.className='err';el.textContent=e.message}}
async function delInteg(id){if(!confirm('Desconectar esta plataforma? As vagas dela deixam de aparecer para os candidatos.'))return;try{const d=await api('DELETE','/integrations/'+id);IG.items=d.items;X.items=null;IGmsg='';render()}catch(e){alert(e.message)}}
/* ---------- avisos em tempo quase real e efeito 3D ---------- */
setInterval(async()=>{if(!S||S.role!=='cand'||document.hidden)return;
try{const m=await api('GET','/me'),up=m.unread>(S.unread||0);S.unread=m.unread;setBell();
if(up){toast('Você tem uma atualização na sua candidatura');apps=await api('GET','/apps');if(tab==='cands')render();else if(tab==='avisos')loadAv()}}catch(e){}},45000);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let raf=0;addEventListener('pointermove',e=>{if(S||raf)return;raf=requestAnimationFrame(()=>{raf=0;const p=$('.deck');if(!p)return;p.style.setProperty('--ry',((e.clientX/innerWidth-.5)*28)+'deg');p.style.setProperty('--rx',(-(e.clientY/innerHeight-.5)*16)+'deg')})},{passive:true})}
init();
</script></body></html>
