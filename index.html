<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15123a">
<title>Talentos — Recrutamento por Insígnias</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e2e5ee;--pr:#4f46e5;--in:#f0f1f7;--ok:#16a34a;--no:#dc2626;--bz:#b9783f;--pt:#7d8aa3;--ou:#d99a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1219;--card:#181c26;--tx:#eceef5;--mu:#98a1b5;--bd:#2a3040;--pr:#818cf8;--in:#222838}}
:root[data-theme="dark"]{--bg:#0f1219;--card:#181c26;--tx:#eceef5;--mu:#98a1b5;--bd:#2a3040;--pr:#818cf8;--in:#222838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:920px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0 12px}
.br{font-weight:800;font-size:19px}.br span{color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}h2{margin:4px 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);font:inherit}
textarea{resize:vertical}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.g.fg{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.fg>label:first-child{grid-column:1/-1}
.g3{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
a{color:var(--pr)}
.it{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--bd);background:var(--in);color:var(--tx);padding:8px 13px}
button.pri{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button.sm{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button.on,.seg .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--in);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:13px}
.chip b{margin-left:6px;cursor:pointer;color:var(--mu)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.no{border-color:var(--no);color:var(--no);opacity:.8}
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-weight:700;font-size:13px;color:#fff}
.Bronze{background:var(--bz)}.Prata{background:var(--pt)}.Ouro{background:var(--ou)}.Nenhuma{background:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--in);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}.big{font-size:40px;line-height:1}
.pct{font-size:22px;font-weight:800;color:var(--pr)}
.err{color:var(--no);font-size:13px;min-height:18px}
details summary{cursor:pointer;color:var(--pr);font-weight:600;margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}

:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.tabs button{white-space:nowrap;flex:none}
.btn,.btn-file{display:inline-block;text-decoration:none;font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--bd);background:var(--in);color:var(--tx);padding:8px 13px}
.btn.pri{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.btn-file{position:relative;font-size:14px;font-weight:600;margin-top:6px}
.btn-file:focus-within{outline:2px solid var(--pr);outline-offset:2px}
.sw{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)}.sw input{width:auto;margin:0}
.bell{position:relative;padding:5px 9px}
.bell i{position:absolute;top:-6px;right:-6px;display:inline-block;background:var(--no);color:#fff;border-radius:99px;font:700 11px/1 system-ui,sans-serif;padding:3px 6px}
.bell i[hidden]{display:none}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stb{padding:5px 11px;font-size:13px;border-radius:99px}
.stb.cur{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.stb.rej.cur{background:var(--no);border-color:var(--no)}
.stb:disabled{cursor:default;opacity:.75}
.mvp{border:1px solid var(--pr);border-radius:12px;padding:12px;margin:10px 0;background:var(--in)}
.msg{white-space:pre-wrap;font:inherit;margin:6px 0;padding:10px;border-radius:9px;background:var(--bg);border:1px solid var(--bd);max-height:240px;overflow:auto}
.res{border-left:3px solid var(--ok);padding:4px 10px;margin:8px 0;font-size:14px}.res .btn{margin:6px 0}
.nt.new{border-color:var(--pr)}
.stp{display:flex;gap:4px;list-style:none;padding:0;margin:10px 0 4px}
.stp li{flex:1;text-align:center;font-size:12px;color:var(--mu);border-top:4px solid var(--bd);padding-top:4px}
.stp li.done{border-color:var(--ok);color:var(--tx)}.stp li.cur{border-color:var(--pr);color:var(--pr);font-weight:700}
.stp.off{opacity:.45}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#1b1f2a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;font-size:14px;border:1px solid #3a4157}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---- tela de entrada ---- */
body.auth{background:radial-gradient(ellipse 70% 55% at 28% -5%,rgba(129,140,248,.30),transparent 70%),#15123a;color:#f3f1ff}
body.auth header{display:none}
body.auth .w{max-width:none;padding:0}
.stage{min-height:100vh;min-height:100svh;max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,56px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,410px);gap:clamp(24px,5vw,80px);align-items:center}
.mark{display:flex;align-items:center;gap:10px;font:700 20px var(--serif)}
.hero h1{font:700 clamp(32px,4.8vw,56px)/1.06 var(--serif);letter-spacing:-.012em;margin:22px 0 14px}
.hero h1 span{display:block}
.sub{color:#cfcbf3;font-size:17px;line-height:1.55;max-width:44ch;margin:0}
.hint{color:#a9a4dc;font-size:13px;margin:14px 0 0;max-width:52ch}
.podium{--rx:0deg;--ry:0deg;display:flex;align-items:flex-end;gap:10px;max-width:500px;margin-top:34px;border-bottom:2px solid rgba(255,255,255,.14)}
.blk small{font-size:inherit}
.pd{flex:1;display:flex;flex-direction:column;align-items:center}
.pd.g{--d:148px;--m1:#f6d56a;--m2:#b98a12;--m3:#fff0b3;--edge:#9a7209}
.pd.s{--d:104px;--m1:#eef1f7;--m2:#8793a9;--m3:#ffffff;--edge:#6e7a90}
.pd.b{--d:104px;--m1:#e5a870;--m2:#8a4f22;--m3:#f8cfa3;--edge:#6d3b17}
.pd .medal{width:var(--d);height:var(--d);margin-bottom:8px;perspective:640px;animation:drop .9s cubic-bezier(.2,.75,.25,1) both}
.pd.b .medal{animation-delay:.05s}.pd.s .medal{animation-delay:.3s}.pd.g .medal{animation-delay:.55s}
.tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease-out}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.pd.g .coin{animation:spin 18s linear 1.6s infinite}
.coin i{position:absolute;inset:0;border-radius:50%;background:var(--edge)}
.coin .fc,.coin .bk{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--m1),var(--m2),var(--m3),var(--m2),var(--m1))}
.coin .fc{transform:translateZ(5px)}.coin .bk{transform:rotateY(180deg) translateZ(5px)}
.coin .fc::before,.coin .bk::before{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.coin span{font-size:calc(var(--d)*.2);letter-spacing:.04em;color:rgba(50,30,0,.78);text-shadow:0 1px 0 rgba(255,255,255,.55)}
.blk{width:100%;border-radius:8px 8px 0 0;padding:12px 6px 0;text-align:center;background:linear-gradient(#3b3590,#262163);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#f3f1ff}
.blk b{display:block;font:700 17px var(--serif)}.blk span{display:block;font-size:12px;color:#bdb8ee;margin-top:2px}
.pd.g .blk{height:128px}.pd.s .blk{height:94px}.pd.b .blk{height:68px}
.authcard{color:var(--tx);max-width:410px;width:100%;justify-self:end;margin:0;box-shadow:0 24px 60px rgba(5,4,30,.55)}
.authcard h2{font-family:var(--serif);font-size:24px}
@keyframes drop{from{transform:translateY(-160px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotateY(360deg)}}
@media(max-width:860px){
.stage{grid-template-columns:1fr;gap:24px;align-items:start;padding:20px 16px 32px}
.authcard{justify-self:stretch;max-width:none}
.pd.g{--d:104px}.pd.s,.pd.b{--d:74px}
.pd.g .blk{height:92px}.pd.s .blk{height:68px}.pd.b .blk{height:50px}
.blk b{font-size:15px}.blk span{font-size:11px}
.podium{margin-top:22px;max-width:380px}.hint{display:none}.sub{font-size:16px}.ap{display:none}}
@media(prefers-reduced-motion:reduce){.pd .medal,.pd.g .coin{animation:none}.tilt{transition:none}#toast{transition:none}}
</style></head><body><div class="w"><header><div class="br">🏅 Talent<span>os</span></div><div id="hd"></div></header><div id="app"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="dl-sk"></datalist><datalist id="dl-rl"></datalist><datalist id="dl-ar"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EDU={'Ensino médio':2,'Técnico':5,'Graduação':8,'Pós-graduação':12,'Mestrado/Doutorado':15};
const ENG={'Nenhum':0,'Básico':1,'Intermediário':3,'Avançado':5,'Fluente':7};
const AV=['Imediata','15 dias','30 dias','Mais de 30 dias'],MD=['Presencial','Híbrido','Remoto'];
const QT={text:'Texto curto',long:'Texto longo',choice:'Múltipla escolha',yesno:'Sim/Não',number:'Número',date:'Data',url:'Link'};
const UF={AC:['Acre','Rio Branco'],AL:['Alagoas','Maceió'],AP:['Amapá','Macapá'],AM:['Amazonas','Manaus'],BA:['Bahia','Salvador'],CE:['Ceará','Fortaleza'],DF:['Distrito Federal','Brasília'],ES:['Espírito Santo','Vitória'],GO:['Goiás','Goiânia'],MA:['Maranhão','São Luís'],MT:['Mato Grosso','Cuiabá'],MS:['Mato Grosso do Sul','Campo Grande'],MG:['Minas Gerais','Belo Horizonte'],PA:['Pará','Belém'],PB:['Paraíba','João Pessoa'],PR:['Paraná','Curitiba'],PE:['Pernambuco','Recife'],PI:['Piauí','Teresina'],RJ:['Rio de Janeiro','Rio de Janeiro'],RN:['Rio Grande do Norte','Natal'],RS:['Rio Grande do Sul','Porto Alegre'],RO:['Rondônia','Porto Velho'],RR:['Roraima','Boa Vista'],SC:['Santa Catarina','Florianópolis'],SP:['São Paulo','São Paulo'],SE:['Sergipe','Aracaju'],TO:['Tocantins','Palmas']};
const SUG={'dl-sk':['JavaScript','TypeScript','Python','Java','C#','PHP','SQL','React','Node.js','HTML/CSS','Git','Docker','AWS','Excel','Power BI','Atendimento','Vendas','Negociação','Liderança','Comunicação','Gestão de projetos','Scrum','Marketing digital','SEO','Design gráfico','Figma','Contabilidade','Logística','Inglês técnico','Análise de dados'],
'dl-rl':['Desenvolvedor(a)','Analista','Assistente','Auxiliar','Coordenador(a)','Gerente','Estagiário(a)','Vendedor(a)','Atendente','Designer','Contador(a)','Motorista','Técnico(a)','Supervisor(a)'],
'dl-ar':['Tecnologia','Suporte','Vendas','Marketing','Financeiro','RH','Logística','Operações','Jurídico','Saúde','Educação','Atendimento']};
const EMPTY=()=>({uf:'',city:'',phone:'',link:'',summary:'',edu:'Ensino médio',eng:'Nenhum',avail:'Imediata',salary:'',skills:[],exps:[],certs:[]});
const newJ=()=>({title:'',area:'',desc:'',skills:[],minYears:0,minEdu:'Ensino médio',uf:'',city:'',mode:'Presencial',qs:[]});
let S=null,jobs=[],apps=[],cands=[],role='cand',mode='login',tab='',P=null,J=null,sel=null,applying=null,flt='all',pool=false,sec={},pend=null,rtok='',note='',team=[],teamErr='';
const STG=['Recebida','Triagem','Entrevista','Proposta','Aprovado','Recusado'],MSTG=STG.slice(1),STEPS=STG.slice(0,5);
const defF={q:'',uf:'',mode:'',area:'',min:0,sort:'match'};
let F={...defF},X={q:'',where:'',src:'',items:null,total:0,sources:[],loading:false,err:''},NT=null,MG=null,MGerr='',IG=null,IGerr='',IGmsg='',mv=null,mvInfo={date:'',time:'',place:''},lastMv={},stF='all',toastT=0,xT=0,xSeq=0;
const fmtD=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const fsz=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
const fillT=(t,v)=>String(t).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3800)}
function setBell(){const b=$('#bn');if(b){b.textContent=S.unread||0;b.hidden=!S.unread}const t=$('#tb-avisos');if(t)t.textContent='Avisos'+(S.unread?` (${S.unread})`:'')}
function resetAll(){S=null;P=J=null;jobs=[];apps=[];cands=[];NT=null;MG=null;IG=null;team=[];X.items=null;F={...defF};mv=null;lastMv={};stF='all';sel=null;applying=null;sec={}}
const tabsHtml=t=>`<div class="tabs" role="tablist">${t.map(x=>`<button role="tab" ${x[0]==='avisos'?'id="tb-avisos"':''} aria-selected="${tab===x[0]}" class="${tab===x[0]?'on':''}" onclick="goTab('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
async function syncRec(){try{const[j,a,c]=await Promise.all([api('GET','/jobs'),api('GET','/apps').catch(()=>apps),api('GET','/candidates').catch(()=>cands)]);jobs=j;apps=a;cands=c;S=await api('GET','/me');if(!mv)render()}catch(e){}}
async function syncVagas(){if(S.role==='rec')return syncRec();try{[jobs,apps]=await Promise.all([api('GET','/jobs'),api('GET','/apps')]);if(tab==='vagas'&&!applying)render()}catch(e){}}
function goTab(t){tab=t;applying=null;sel=null;mv=null;if(t==='nova')J=J||newJ();render();
if(t==='ext'&&!X.items)loadExt();if(t==='avisos')loadAv();if(t==='equipe')loadTeam();if(t==='msgs')loadMsgs();if(t==='integ')loadInteg();if(t==='cands')refreshApps();if(t==='vagas')syncVagas()}
async function api(m,u,b){const r=await fetch('/api'+u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'talentos'},body:b?JSON.stringify(b):undefined});
const d=await r.json().catch(()=>({}));if(r.status===401&&S&&u!=='/me'){resetAll();render()}if(!r.ok)throw new Error(d.error||'Erro de comunicação com o servidor.');return d}
const clone=o=>JSON.parse(JSON.stringify(o));
const NC=()=>({name:'',inst:'',type:'Curso',status:'Concluído',hours:'',start:'',end:'',link:''}),NE=()=>({role:'',co:'',years:0,start:'',end:'',desc:''});
const norm=p=>{p.notifyEmail=p.notifyEmail!==false;p.courses=p.courses||[];(p.certs||[]).forEach(n=>p.courses.push({...NC(),name:n,type:'Certificação'}));p.certs=[];p.exps=p.exps||[];return p};
const ymf=v=>v?v.slice(5)+'/'+v.slice(0,4):'',per=(a,b,cur)=>a||b?[ymf(a),b?ymf(b):cur].filter(Boolean).join(' – '):'';
const CTY=['Curso','Certificação','Workshop/Treinamento','Técnico','Graduação','Pós-graduação','Outro'],CST=['Concluído','Em andamento'];
const yrs=p=>(p.exps||[]).reduce((a,e)=>a+(+e.years||0),0);
const score=p=>Math.min(yrs(p),12)*3+Math.min(p.skills.length,12)*3+(EDU[p.edu]||0)+(ENG[p.eng]||0)+Math.min((p.courses||[]).length+(p.certs||[]).length,5)*3;
const TH=[[70,'Ouro','🥇'],[35,'Prata','🥈'],[10,'Bronze','🥉']];
function badge(sc){const t=TH.find(x=>sc>=x[0]);return t?{n:t[1],e:t[2]}:{n:'Nenhuma',e:'🔹'}}
const pill=sc=>{const b=badge(sc);return`<span class="bd ${b.n}">${b.e} ${b.n==='Nenhuma'?'Iniciante':b.n}</span>`};
function match(p,j){const have=p.skills.map(s=>s.toLowerCase());
const sk=j.skills.length?j.skills.filter(r=>have.includes(r.toLowerCase())).length/j.skills.length:1;
const ex=j.minYears?Math.min(yrs(p)/j.minYears,1):1;
const need=EDU[j.minEdu]||0,ed=need?Math.min((EDU[p.edu]||0)/need,1):1;
const lc=j.mode==='Remoto'||!j.uf?1:p.uf===j.uf?((p.city||'').toLowerCase()===(j.city||'').toLowerCase()||!j.city?1:.7):.2;
return Math.round((sk*.45+ex*.2+ed*.15+Math.min(score(p)/70,1)*.1+lc*.1)*100)}
const place=o=>[o.city,o.uf].filter(Boolean).join('/')||'—';
const CC={};
async function fillCities(uf){if(!$('#city')||!UF[uf])return;const c=S.role==='cand',O=c?P:J,n=c?'P':'J';let l=CC[uf];
if(!l){try{const r=await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);if(!r.ok)throw 0;l=(await r.json()).map(x=>x.nome);CC[uf]=l}catch(e){l=null}}
const el=$('#city');if(!el||!O||O.uf!==uf)return;
if(!l){el.outerHTML=`<input id="city" value="${esc(O.city)}" placeholder="Digite a cidade" onchange="${n}.city=this.value">`;return}
if(O.city&&!l.includes(O.city))l=[O.city,...l];
el.innerHTML='<option value="">Selecione a cidade</option>'+l.map(x=>`<option${x===O.city?' selected':''}>${esc(x)}</option>`).join('')}
async function refresh(){jobs=await api('GET','/jobs');if(S.role==='rec')[apps,cands]=await Promise.all([api('GET','/apps').catch(()=>[]),api('GET','/candidates').catch(()=>[])]);else{apps=await api('GET','/apps');cands=[]}}
async function init(){for(const k in SUG)$('#'+k).innerHTML=SUG[k].map(x=>`<option value="${x}">`).join('');
if(location.hash.startsWith('#reset=')){rtok=location.hash.slice(7);mode='reset';history.replaceState(null,'',location.pathname)}
if(!rtok){try{S=await api('GET','/me');await refresh()}catch(e){S=null}}go()}
function go(){if(S){tab=S.role==='cand'?'perfil':'vagas';if(S.role==='cand')P=norm(clone(S.p));sel=null;applying=null}render()}
function render(){document.body.classList.toggle('auth',!S);
$('#hd').innerHTML=S?`${S.role==='cand'?`<button class="bell" onclick="goTab('avisos')" aria-label="Avisos"><span aria-hidden="true">🔔</span><i id="bn"${S.unread?'':' hidden'}>${S.unread||0}</i></button> `:''}<span class="mu">${esc(S.name)} · ${S.role==='rec'?'Recrutador · '+esc(S.company.name)+' · plano '+esc(S.company.limits.name)+' ('+S.company.jobsOpen+'/'+S.company.limits.jobs+' vagas)':'Candidato'}</span> <button class="sm" onclick="out()">Sair</button>`:'';
$('#app').innerHTML=!S?vAuth():S.role==='cand'?vCand():vRec();
fillCities(S?.role==='cand'&&tab==='perfil'?P.uf:tab==='nova'&&J?J.uf:'')}
async function out(){try{await api('POST','/logout')}catch(e){}resetAll();render()}
const er=m=>{const e=$('#er');e.className='err';e.textContent=m};
function setR(r){const k=['nm','em','pw'],v=k.map(i=>$('#'+i)?.value||'');role=r;note='';render();k.forEach((i,n)=>{const e=$('#'+i);if(e)e.value=v[n]})}

function qf(q,i){const n=`q${i}`,L=`<label>${esc(q.label)}`;
if(q.type==='long')return L+`<textarea name="${n}" rows="3"></textarea></label>`;
if(q.type==='choice')return L+`<select name="${n}">${(q.opts.length?q.opts:['Sim','Não']).map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`;
if(q.type==='yesno')return L+`<select name="${n}"><option>Sim</option><option>Não</option></select></label>`;
return L+`<input name="${n}" type="${{text:'text',number:'number',date:'date',url:'url'}[q.type]}"></label>`}

let l=jobs.filter(j=>(!F.uf||j.uf===F.uf)&&(!F.mode||j.mode===F.mode)&&(!F.area||j.area===F.area)).map(j=>({j,m:match(p,j)})).filter(x=>x.m>=F.min&&(!q||[x.j.title,x.j.company,x.j.area,x.j.desc,x.j.city,...x.j.skills].join(' ').toLowerCase().includes(q)));

async function upCV(el){const f=el.files[0];el.value='';const e=$('#cve');if(!f||!e)return;
const ext=(f.name.split('.').pop()||'').toLowerCase();
if(!['pdf','docx'].includes(ext)){e.textContent='Envie um arquivo PDF ou Word (.docx).';return}
if(f.size>3*1024*1024){e.textContent='O arquivo tem '+fsz(f.size)+'. O máximo é 3 MB.';return}
e.className='mu';e.textContent='Enviando…';
try{const r=await fetch('/api/cv',{method:'PUT',credentials:'same-origin',headers:{'X-Requested-With':'talentos','Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:f});
const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível enviar o arquivo.');S=d;render();toast('Currículo enviado')}
catch(x){const e2=$('#cve');if(e2){e2.className='err';e2.textContent=x.message}}}
async function dlCV(id){try{const r=await fetch(id?'/api/cv/'+id:'/api/cv',{credentials:'same-origin'});
if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Não foi possível baixar o arquivo.')}
const b=await r.blob(),m=/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition')||''),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=m?m[1]:'curriculo';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}catch(e){alert(e.message)}}

let l=apps.filter(a=>a.jobId===sel).map(a=>({u:cands.find(x=>x.id===a.candId),a}));

function stageCtl(a,u){const ed=can('move'),i=STG.indexOf(a.status),nx=i>=0&&i<4?STG[i+1]:null,m=mv&&mv.id===a.id,r=lastMv[a.id];

function insVar(s,k){const t=$('#mb-'+s);if(!t)return;const a=t.selectionStart??t.value.length,b=t.selectionEnd??a,v='{'+k+'}';t.value=t.value.slice(0,a)+v+t.value.slice(b);t.focus();t.selectionStart=t.selectionEnd=a+v.length;MG.msgs[s].body=t.value}
function vMsgs(){if(MGerr)return`<div class="card err">${esc(MGerr)}</div>`;if(!MG)return'<div class="card mu">Carregando…</div>';
return`<div class="card"><h3>Mensagens automáticas</h3><p class="mu" style="margin-top:0">Escolha o que o candidato recebe quando você move a candidatura de etapa. Dentro do sistema ele sempre vê um aviso. O e-mail sai pela plataforma e as respostas chegam ao e-mail de quem moveu. No WhatsApp, o link abre a conversa com a mensagem pronta e você confirma o envio.</p></div>${MSTG.map(msgCard).join('')}${MG.canEdit?'<button class="pri" onclick="saveMsgs()">Salvar mensagens</button>':'<p class="mu">Só administrador e RH editam os modelos.</p>'}`}
async function saveMsgs(){try{MG=await api('PUT','/messages',{msgs:MG.msgs});render();toast('Mensagens salvas')}catch(e){alert(e.message)}}
/* ---------- integrações de vagas ---------- */
const PL={greenhouse:'Greenhouse',lever:'Lever'};
async function loadInteg(){IGerr='';IGmsg='';try{IG=await api('GET','/integrations')}catch(e){IGerr=e.message}render()}
function vInteg(){if(IGerr)return`<div class="card err">${esc(IGerr)}</div>`;if(!IG)return'<div class="card mu">Carregando…</div>';
return`<div class="card"><h3>Vagas de outras plataformas</h3><p class="mu" style="margin-top:0">Conecte a página de vagas da sua empresa. As vagas aparecem para todos os candidatos na aba Outras plataformas, com link para se candidatar no site de origem.</p>
${IG.items.map(x=>`<div class="row it"><div><b>${esc(x.label)}</b><div class="mu">${PL[x.type]} · ${esc(x.slug)}</div></div><button class="sm" onclick="delInteg('${x.id}')">Desconectar</button></div>`).join('')||'<p class="mu">Nenhuma plataforma conectada.</p>'}
<div class="g"><label>Plataforma<select id="it"><option value="greenhouse">Greenhouse</option><option value="lever">Lever</option></select></label><label>Identificador<input id="is" maxlength="60" placeholder="ex.: minhaempresa"></label><label>Nome exibido (opcional)<input id="il" maxlength="60" placeholder="${esc(S.company.name)}"></label></div>
<p class="mu">O identificador é o final do endereço da sua página de vagas: boards.greenhouse.io/<b>identificador</b> ou jobs.lever.co/<b>identificador</b>.</p>
<div class="${IGmsg?'mu':'err'}" id="ier">${esc(IGmsg)}</div><button class="pri" onclick="addInteg()">Conectar</button></div>
<div class="card"><h3>Fontes gerais</h3><p class="mu" style="margin-top:0"><b>Remotive</b>: ativa, com vagas remotas do mundo todo.<br><b>Adzuna</b>: ${IG.global.adzuna?'ativa, com vagas do Brasil.':'desativada. Para ativar, crie uma conta gratuita em developer.adzuna.com e defina ADZUNA_APP_ID e ADZUNA_APP_KEY no servidor.'}<br>LinkedIn, Indeed e Gupy não oferecem acesso aberto à lista de vagas e por isso não estão conectados.</p></div>`}
async function addInteg(){try{const d=await api('POST','/integrations',{type:$('#it').value,slug:$('#is').value.trim(),label:$('#il').value.trim()});IG.items=d.items;X.items=null;IGmsg=`Conectado. Encontramos ${d.found} vaga(s) publicada(s).`;render()}catch(e){const el=$('#ier');el.className='err';el.textContent=e.message}}
async function delInteg(id){if(!confirm('Desconectar esta plataforma? As vagas dela deixam de aparecer para os candidatos.'))return;try{const d=await api('DELETE','/integrations/'+id);IG.items=d.items;X.items=null;IGmsg='';render()}catch(e){alert(e.message)}}
/* ---------- avisos em tempo quase real e efeito 3D ---------- */
setInterval(async()=>{if(!S||S.role!=='cand'||document.hidden)return;
try{const m=await api('GET','/me'),up=m.unread>(S.unread||0);S.unread=m.unread;setBell();
if(up){toast('Você tem uma atualização na sua candidatura');apps=await api('GET','/apps');if(tab==='cands')render();else if(tab==='avisos')loadAv()}}catch(e){}},45000);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let raf=0;addEventListener('pointermove',e=>{if(S||raf)return;raf=requestAnimationFrame(()=>{raf=0;const p=$('.podium');if(!p)return;p.style.setProperty('--ry',((e.clientX/innerWidth-.5)*40)+'deg');p.style.setProperty('--rx',(-(e.clientY/innerHeight-.5)*24)+'deg')})},{passive:true})}
init();
</script></body></html>
